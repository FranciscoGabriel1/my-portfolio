<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1024, initial-scale=1">
<title>Notebook · programando os projetos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Tela do notebook da cena 3D: 1024 × 640 (16:10). Editor genérico no estilo do VS Code, sem marcas.
     O código monta a vitrine de projetos; o preview mostra o site de cada um (prints de public/images/projects).
     Abra com ?rec para gravar uma passada só (sem loop), como faz o script de gravação. */
  :root {
    --ed-bg:#1b1d22; --ed-side:#16181c; --ed-bar:#121316; --ed-line:#2a2d34; --ed-text:#c9ccd3; --ed-dim:#5d636e;
    --kw:#c792ea; --tag:#ff8a55; --attr:#82aaff; --str:#c3e88d; --fn:#ffcb6b; --punc:#89ddff;
    --site-bg:#141311; --site-text:#f2eee6; --site-text-2:#bdb6a8; --accent:#ff6b2c; --ok:#5bc48a;
  }
  * { box-sizing:border-box; margin:0; }
  html, body { width:1024px; height:640px; overflow:hidden; background:#000; }
  .screen { position:relative; width:1024px; height:640px; display:grid; grid-template-columns:44px 150px 1fr 430px; grid-template-rows:30px 1fr 22px; font:13px/1.55 "JetBrains Mono", ui-monospace, monospace; color:var(--ed-text); background:var(--ed-bg); }

  .title { grid-column:1 / -1; display:flex; align-items:center; gap:8px; padding:0 12px; background:var(--ed-bar); border-bottom:1px solid var(--ed-line); font:12px "Instrument Sans", system-ui; color:var(--ed-dim); }
  .dots { display:flex; gap:7px; }
  .dots i { width:11px; height:11px; border-radius:50%; background:#ff5f57; } .dots i:nth-child(2){ background:#febc2e; } .dots i:nth-child(3){ background:#28c840; }
  .title .name { margin:0 auto; color:#9aa0aa; }

  .activity { background:var(--ed-bar); border-right:1px solid var(--ed-line); display:flex; flex-direction:column; align-items:center; gap:18px; padding-top:14px; }
  .activity span { width:20px; height:20px; border:2px solid #4b515c; border-radius:4px; }
  .activity span:first-child { border-color:#c9ccd3; }
  .explorer { background:var(--ed-side); border-right:1px solid var(--ed-line); padding:10px 0; font-size:12px; }
  .explorer h6 { font:600 10px "Instrument Sans"; letter-spacing:.12em; color:var(--ed-dim); padding:0 14px 8px; }
  .explorer div { padding:2px 14px; color:#9aa0aa; white-space:nowrap; }
  .explorer .d2 { padding-left:26px; } .explorer .d3 { padding-left:38px; }
  .explorer .on { background:#262a31; color:#e7e9ee; }

  .editor { position:relative; display:flex; flex-direction:column; min-width:0; }
  .tabs { display:flex; height:32px; background:var(--ed-side); border-bottom:1px solid var(--ed-line); font-size:12px; }
  .tabs div { padding:7px 14px; color:var(--ed-dim); border-right:1px solid var(--ed-line); }
  .tabs .on { background:var(--ed-bg); color:#e7e9ee; border-top:2px solid var(--accent); padding-top:5px; }
  .code { position:relative; flex:1; padding:12px 0; overflow:hidden; }
  .ln { display:flex; white-space:pre; height:20.15px; }
  .ln .n { width:40px; padding-right:12px; text-align:right; color:#3e434c; flex-shrink:0; }
  .ln.cur { background:#20232a; } .ln.cur .n { color:#9aa0aa; }
  .ln.sel { background:#264f78; }
  .caret { display:inline-block; width:2px; height:16px; background:#e7e9ee; vertical-align:-3px; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .k{color:var(--kw)} .t{color:var(--tag)} .a{color:var(--attr)} .s{color:var(--str)} .f{color:var(--fn)} .p{color:var(--punc)}

  .suggest { position:absolute; width:220px; background:#22252c; border:1px solid #363a43; border-radius:6px; box-shadow:0 10px 30px rgba(0,0,0,.45); font-size:12px; padding:4px; opacity:0; transform:translateY(-4px); transition:opacity .15s, transform .15s; }
  .suggest.show { opacity:1; transform:none; }
  .suggest div { padding:3px 8px; border-radius:4px; color:#b9bec8; display:flex; gap:8px; }
  .suggest div:first-child { background:#2f3540; color:#fff; }
  .suggest b { color:var(--str); font-weight:400; width:12px; }

  /* Preview: navegador com o site de cada projeto. */
  .preview { grid-row:2; grid-column:4; background:var(--ed-side); border-left:1px solid var(--ed-line); display:flex; flex-direction:column; }
  .url { position:relative; height:32px; display:flex; align-items:center; gap:8px; padding:0 10px; border-bottom:1px solid var(--ed-line); font:11.5px "Instrument Sans"; color:#9aa0aa; }
  .url span { flex:1; background:#22252c; border-radius:6px; padding:4px 10px; white-space:nowrap; overflow:hidden; }
  .url i { width:8px; height:8px; border-radius:50%; background:var(--ok); flex-shrink:0; }
  .url .bar { position:absolute; left:0; bottom:-1px; height:2px; width:0; background:var(--accent); }
  .url .bar.go { animation:load .55s cubic-bezier(.4,0,.2,1) forwards; }
  @keyframes load { 0% { width:0; opacity:1; } 85% { width:100%; opacity:1; } 100% { width:100%; opacity:0; } }
  .site { position:relative; flex:1; background:var(--site-bg); overflow:hidden; font-family:"Instrument Sans", system-ui; color:var(--site-text); }
  .empty { position:absolute; inset:0; display:grid; place-items:center; color:#4b4a46; font:12px "JetBrains Mono"; opacity:0; transition:opacity .3s; }
  .site.is-empty .empty { opacity:1; }
  .card { position:absolute; inset:0; padding:18px; display:flex; flex-direction:column; gap:14px; opacity:0; transform:translateY(14px) scale(.98); transition:opacity .45s cubic-bezier(.2,.8,.2,1), transform .6s cubic-bezier(.16,1,.3,1); }
  .card.in { opacity:1; transform:none; }
  .card.out { opacity:0; transform:translateY(-10px) scale(.98); }
  .shot { border-radius:10px; overflow:hidden; border:1px solid #2c2a26; box-shadow:0 18px 40px rgba(0,0,0,.45); background:#fff; }
  .shot img { display:block; width:100%; height:220px; object-fit:cover; object-position:top left; }
  .meta { display:flex; flex-direction:column; gap:6px; }
  .ctx { font:10px "JetBrains Mono"; letter-spacing:.14em; text-transform:uppercase; color:#ff8a55; }
  .card h2 { font:800 30px/1 "Bricolage Grotesque"; letter-spacing:-.03em; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chips span { font-size:11px; padding:3px 9px; border-radius:999px; border:1px solid #34312c; color:var(--site-text-2); }

  .toast { position:absolute; left:50%; bottom:14px; z-index:2; transform:translate(-50%, 8px); padding:5px 12px; border-radius:6px; background:#1f2a22; border:1px solid #2f5a3c; color:#8fe0ae; font:11.5px "JetBrains Mono"; opacity:0; transition:opacity .25s, transform .25s; }
  .toast.show { opacity:1; transform:translate(-50%, 0); }

  .status { grid-column:1 / -1; display:flex; align-items:center; gap:16px; padding:0 12px; background:#d9531f; color:#fff; font:11px "Instrument Sans"; }
  .status span:last-child { margin-left:auto; }
</style>
</head>
<body>
<div class="screen">
  <div class="title"><span class="dots"><i></i><i></i><i></i></span><span class="name">Projects.tsx — portfolio</span></div>
  <div class="activity"><span></span><span></span><span></span><span></span></div>
  <div class="explorer">
    <h6>EXPLORER</h6>
    <div>▾ portfolio</div>
    <div class="d2">▸ app</div>
    <div class="d2">▾ components</div>
    <div class="d3">Hero.tsx</div>
    <div class="d3 on">Projects.tsx</div>
    <div class="d3">Skills.tsx</div>
    <div class="d2">▸ lib</div>
    <div class="d2">▸ messages</div>
    <div class="d2">▸ public</div>
    <div class="d2">package.json</div>
  </div>
  <div class="editor">
    <div class="tabs"><div class="on">Projects.tsx</div><div>projects.ts</div></div>
    <div class="code" id="code"></div>
    <div class="suggest" id="suggest"><div><b>"</b>uprobotics</div><div><b>"</b>teksto</div><div><b>"</b>atem</div></div>
  </div>
  <div class="preview">
    <div class="url"><i></i><span id="url">localhost:3000</span><b class="bar" id="bar"></b></div>
    <div class="site" id="site">
      <div class="empty">no projects yet</div>
      <div class="toast" id="toast">✓ Compiled in 118 ms</div>
    </div>
  </div>
  <div class="status"><span>⎇ main</span><span>TypeScript React</span><span>Ln <b id="lnc">1</b></span><span>Prettier ✓</span></div>
</div>
<script>
  // Projetos do vídeo: prints e stack reais (lib/content/projects.ts).
  const IMG = "../../../public/images/projects/";
  const PROJECTS = {
    curriculoraiz: { url: "curriculoraiz.com", name: "CurrículoRaiz", ctx: "Own product · founder", img: "curriculoraiz.webp", stack: ["React", "TypeScript", "Node.js", "Prisma", "Puppeteer"] },
    hostgator: { url: "cliente.hostgator.com.br", name: "HostGator dashboard", ctx: "HostGator", img: "dash_hg.png", stack: ["React", "Redux Saga", "Styled Components", "Jest"] },
    atem: { url: "portal.grupoatem.com.br", name: "Customer portal", ctx: "Atem", img: "portal_atem.webp", stack: ["React", "TypeScript", "Cognito"] },
    teksto: { url: "teksto.com", name: "Teksto", ctx: "O2 Filmes", img: "teksto.png", stack: ["React", "TypeScript", "ProseMirror"] },
    uprobotics: { url: "uprobotics.com.br", name: "UpRobotics", ctx: "iComp UFAM · master's", img: "uprobotics.png", stack: ["React", "Blockly", "Webots"] },
  };
  const ORDER = ["curriculoraiz", "hostgator", "atem", "teksto", "uprobotics"];

  const project = (id) => ({ parts: [["","      "],["p","<"],["f","Project "],["a","id"],["p","="],["s",`"${id}"`],["p"," />"]], show: id });
  const LINES = [
    { parts: [["k","import "],["p","{ "],["f","Project"],["p",", "],["f","Showcase"],["p"," } "],["k","from "],["s","\"@/ui\""],["p",";"]] },
    { parts: [] },
    { parts: [["k","export function "],["f","Projects"],["p","() {"]] },
    { parts: [["","  "],["k","return "],["p","("]] },
    { parts: [["","    "],["p","<"],["f","Showcase"],["p",">"]] },
    ...ORDER.map(project),
    { parts: [["","    "],["p","</"],["f","Showcase"],["p",">"]] },
    { parts: [["","  "],["p",");"]] },
    { parts: [["p","}"]] },
  ];
  const FIRST = 5, LAST = FIRST + ORDER.length - 1;
  LINES[LAST].suggest = 14;

  const REC = new URLSearchParams(location.search).has("rec");
  const $ = (id) => document.getElementById(id);
  const code = $("code"), site = $("site"), suggest = $("suggest"), toast = $("toast"), url = $("url"), bar = $("bar"), lnc = $("lnc");
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const textOf = (line) => line.parts.map(([, t]) => t).join("");

  // Um cartão por projeto, criado uma vez (as imagens já ficam carregadas).
  const cards = {};
  for (const id of ORDER) {
    const p = PROJECTS[id];
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `<div class="shot"><img src="${IMG + p.img}" alt=""></div><div class="meta"><span class="ctx">${p.ctx}</span><h2>${p.name}</h2><div class="chips">${p.stack.map((s) => `<span>${s}</span>`).join("")}</div></div>`;
    site.insertBefore(el, toast);
    cards[id] = el;
  }
  let shown = null;
  function show(id) {
    if (shown === id) return;
    if (shown) { const old = cards[shown]; old.classList.remove("in"); old.classList.add("out"); setTimeout(() => old.classList.remove("out"), 500); }
    shown = id;
    url.textContent = id ? PROJECTS[id].url : "localhost:3000";
    bar.classList.remove("go"); void bar.offsetWidth; if (id) bar.classList.add("go");
    if (id) cards[id].classList.add("in");
    site.classList.toggle("is-empty", !id);
  }

  /** Desenha o código: linhas até `upto` (a atual com `typed` caracteres), linhas ocultas em `hidden`, seleção em `sel`. */
  function render(upto, typed, { hidden = new Set(), sel = new Set(), cur = upto } = {}) {
    code.innerHTML = LINES.map((line, i) => {
      if (i > upto || hidden.has(i)) return "";
      let budget = i === upto ? typed : Infinity, html = "";
      for (const [cls, text] of line.parts) {
        if (budget <= 0) break;
        const t = text.slice(0, budget); budget -= t.length;
        html += cls ? `<span class="${cls}">${esc(t)}</span>` : esc(t);
      }
      const caret = i === cur ? '<span class="caret"></span>' : "";
      const cls = sel.has(i) ? " sel" : i === cur ? " cur" : "";
      return `<div class="ln${cls}"><span class="n">${i + 1}</span><span>${html}${caret}</span></div>`;
    }).join("");
    lnc.textContent = cur + 1;
  }

  // Estado de começo e fim: arquivo completo, cursor na linha do CurrículoRaiz, preview no CurrículoRaiz.
  function showDone() { render(LINES.length - 1, Infinity, { cur: FIRST }); show("curriculoraiz"); }

  async function run() {
    showDone();
    // Marca para o script de gravação (scripts/scene-screens/record-code.js): a passada começa aqui.
    document.title = "start";
    await wait(2000);
    // Seleciona e apaga os projetos: a vitrine fica vazia.
    const projectLines = new Set(ORDER.map((_, k) => FIRST + k));
    render(LINES.length - 1, Infinity, { sel: projectLines, cur: LAST });
    await wait(500);
    show(null);
    const rest = (i) => new Set([...projectLines].filter((k) => k >= i));
    for (let i = FIRST; i <= LAST; i++) {
      const line = LINES[i], text = textOf(line);
      for (let c = 0; c <= text.length; c++) {
        // Linhas de projeto ainda não digitadas ficam ocultas; o fechamento da vitrine continua visível abaixo.
        code.innerHTML = "";
        renderTyping(i, c, rest(i + 1));
        if (line.suggest !== undefined && c === line.suggest) {
          const cur = code.querySelector(".cur");
          suggest.style.left = 40 + 7.8 * c + "px";
          suggest.style.top = cur.offsetTop + 34 + "px";
          suggest.classList.add("show"); await wait(550); suggest.classList.remove("show");
        }
        const ch = text[c] || "";
        await wait(/[\s<>{}()"=/]/.test(ch) ? 28 + Math.random() * 36 : 14 + Math.random() * 18);
      }
      show(line.show);
      await wait(2300);
    }
    // Volta ao primeiro projeto e recompila: o fim fica igual ao começo (loop sem emenda).
    showDone();
    toast.classList.add("show");
    await wait(1800);
    toast.classList.remove("show");
    await wait(300);
  }

  function renderTyping(i, c, hiddenAfter) {
    code.innerHTML = LINES.map((line, k) => {
      if (hiddenAfter.has(k)) return "";
      let budget = k === i ? c : Infinity, html = "";
      for (const [cls, text] of line.parts) {
        if (budget <= 0) break;
        const t = text.slice(0, budget); budget -= t.length;
        html += cls ? `<span class="${cls}">${esc(t)}</span>` : esc(t);
      }
      const caret = k === i ? '<span class="caret"></span>' : "";
      return `<div class="ln${k === i ? " cur" : ""}"><span class="n">${k + 1}</span><span>${html}${caret}</span></div>`;
    }).join("");
    lnc.textContent = i + 1;
  }

  (async () => {
    showDone();
    await document.fonts.ready;
    await Promise.all([...document.images].map((img) => img.decode().catch(() => {})));
    do { await run(); if (REC) { document.title = "done"; break; } } while (true);
  })();
</script>
</body>
</html>
